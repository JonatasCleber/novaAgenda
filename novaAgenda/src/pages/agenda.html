<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Agendar</title>
</head>
<body>
    <main>
        <section>
            <form id="form-agendar">
                <label for="nome">nome completo</label>
                <input type="text" id="nome" name="nome">
                <div id="inp">
                    <div class="edit">
                        <label for="cpf">cpf</label>
                        <input type="text" id="cpf" name="cpf">
                        <label for="telefone">telefone/whatsapp</label>
                        <input type="text" id="telefone" name="telefone">
                        <label for="convenio">convênio (opcional)</label>
                        <input type="text" id="convenio" name="convenio">
                    </div>
                    <div class="edit">
                        <label for="data-nascimento">data de nascimento</label>
                        <input type="date" id="data-nascimento" name="data-nascimento">
                        <label for="email">email</label>
                        <input type="email" id="email" name="email">
                        <label for="carteirinha">n° da carteirinha</label>
                        <input type="text" id="carteirinha" name="carteirinha">
                    </div>
                </div>
                 <label class="checkbox-container">
                    <input type="checkbox" name="aceite" id="check" checked>
                    <span>atendimento, necessidades especiais, <br> termos de consentimento ou confirmações obrigatórias.</span>
                 </label>
                <button type="submit">Agendar</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
    <script src="server.js"></script>
</body>
</html>
